<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk ke Sistem - WartaSehat.id</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Local Custom CSS (Clean Clinical Minimalism with Soft Glassmorphism) -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body class="ws-auth-wrapper">

  <div class="ws-auth-card">
    <div class="ws-auth-header">
      <div class="ws-auth-logo">
        <!-- Medical Cross SVG Icon -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6v12M6 12h12"/>
          <circle cx="12" cy="12" r="10" stroke-width="1.8"/>
        </svg>
      </div>
      <h1 class="ws-auth-title">WartaSehat<span>.id</span></h1>
      <p class="ws-auth-subtitle">Sistem Informasi Manajemen Pasien & Rekam Medik</p>
    </div>

    <!-- Feedback Message Demonstration (Simulasi respons error dari Backend) -->
    <!-- Backend PHP dapat merender blok alert ini jika login gagal -->
    <div class="alert alert-danger d-none" role="alert" id="authErrorAlert">
      <div class="alert-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="alert-content">
        <div class="alert-title">Autentikasi Gagal</div>
        <div>Username atau kata sandi tidak sesuai. Silakan periksa kembali.</div>
      </div>
    </div>

    <!-- Formulir Login Utama (POST ke Backend PHP Native) -->
    <form action="../petugas/dashboard.html" method="POST" autocomplete="on">
      <div class="form-group mb-3">
        <label for="username" class="form-label">
          Username Pengguna <span class="required">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input 
            type="text" 
            class="form-control" 
            id="username" 
            name="username" 
            placeholder="Masukkan username Anda" 
            required 
            autofocus
            maxlength="50"
          >
        </div>
        <div class="form-text">Contoh akun: <code>petugas_budi</code> atau <code>dr_hendra</code></div>
      </div>

      <div class="form-group mb-4">
        <label for="password" class="form-label">
          Kata Sandi <span class="required">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input 
            type="password" 
            class="form-control" 
            id="password" 
            name="password" 
            placeholder="Masukkan kata sandi" 
            required 
            minlength="4"
            maxlength="100"
          >
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Masuk ke Sistem
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <a href="../../index.html" class="text-muted small text-decoration-none">
        &larr; Kembali ke Halaman Utama Portal
      </a>
      <div class="text-muted small mt-2">
        &copy; 2026 WartaSehat.id &bull; Versi 1.0 (Klinik & RS Pratama)
      </div>
    </div>
  </div>

</body>
</html>
